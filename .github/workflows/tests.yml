name: tests

# NOTE: this is expected to be RED until the placeholder copyright holder in
# LICENSE is replaced. That failure is deliberate (see PUBLISHING.md); a green
# badge over an unpublishable license would be the exact kind of reassuring,
# false signal this project exists to prevent.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # Both platforms, because the git hooks are shell scripts and the tests run
    # them through a real `sh`. Line-ending and interpreter-resolution bugs in
    # those hooks only appear on one platform at a time, which is how one of
    # them survived undetected on POSIX for its entire existence.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show versions
        run: |
          python --version
          git --version

      # The TOOL has no third-party dependencies. The test suite is a separate
      # question and needs pytest, which is not in the standard library. This
      # step was originally missing, under a comment asserting that nothing
      # needed installing, and all six matrix jobs failed identically.
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run the suite
        run: python -m pytest

  self-check:
    # The tool validating its own handoff document. Restricted to pushes on
    # main because the ancestry checks need a local `main` ref to resolve
    # against, and fetch-depth 0 because a shallow clone cannot answer "is this
    # commit an ancestor of trunk" at all -- it would report dead references
    # for commits that exist perfectly well.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate this repository's own handoff document
        run: python plugin/skills/handoff/payload/handoff_collect.py --verify --repo .
