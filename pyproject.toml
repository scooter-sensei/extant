# Packaging exists for ONE reason: the pre-commit framework builds an isolated
# environment from a repository, and `language: python` needs something
# installable to build. Without this file, adopting the tool through pre-commit
# is impossible.
#
# This does not change how the tool is normally installed. The hooks and the
# slash command have to live inside the target repository, so `install.py`
# copying files in remains the primary path. Packaging covers the validation
# half only, which is the half pre-commit runs.
#
# One conditional dependency, deliberately. On Python 3.11 and newer this is
# the standard library and git, nothing else; below that `tomllib` does not
# exist yet, so `tomli` - the same parser under its original name - is pulled
# in to read a config file. A project with no config file needs neither.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "extant"
version = "0.27.0"
description = "Find the commits, branches and paths your documentation cites that no longer exist"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
# Conditional, and only for the PACKAGED path: pre-commit builds an isolated
# environment from this file, so a consumer on 3.9 or 3.10 gets the parser
# without being told to install anything. On 3.11+ this resolves to nothing
# and the tool has no dependencies at all. The copy-the-files-in path never
# reads this and degrades on its own.
dependencies = ['tomli>=2; python_version < "3.11"']
authors = [{name = "scooter-sensei"}]
keywords = ["documentation", "validation", "git", "pre-commit", "ai-agents",
            "agents", "llm", "adr", "documentation-rot", "stale-docs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/scooter-sensei/extant"
Changelog = "https://github.com/scooter-sensei/extant/blob/main/CHANGELOG.md"

# The package, not the shim. `extant_collect.py` is still shipped and still
# invocable by path - the git hook, the README and the /extant command all name
# it that way - but it holds nothing except a version handshake and this import,
# so pointing the console script through it would add a module to the chain for
# no reason. Nobody notices the change: consumers of the packaged path run
# `extant`, which is this name.
[project.scripts]
extant = "extant.cli:cli"

[tool.setuptools]
package-dir = {"" = "plugin/skills/extant/payload"}
py-modules = ["extant_collect"]
# `extant.rules` is listed EXPLICITLY, and it has to be: setuptools takes this
# list literally rather than as a prefix, so a subpackage left off is simply
# not built. The failure would be loud - the registry raises rather than
# assembling an empty RULES - but it would only be loud for the pre-commit
# path, which is the one path nobody runs locally.
packages = ["extant", "extant.rules"]

# The SUITE's own denominator, and nothing the tool reads. Measured on
# 2026-09-15 with every process the suite and the harnesses spawn instrumented:
# 95.9 per cent of the package's statements, with gate.py at 97.2 and cli.py at
# 98.8 - against 56.6 and 68.1 when the suite's own `run_tool` subprocesses go
# unmeasured, which is what a plain `pytest --cov` reports and what the
# internals review took for untested exit-code logic. The instructions that
# reproduce the number are in tests/harnesses/README.md; the package is named
# rather than pathed so the arena copies the harnesses install as `tools/extant`
# count too, and `[tool.coverage.paths]` folds them back onto these files.
# Never a gate: a denominator is printed, not failed on.
[tool.coverage.run]
source_pkgs = ["extant"]
parallel = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.paths]
extant = [
    "plugin/skills/extant/payload/extant",
    "*/tools/extant",
    "*/payload/extant",
]

[tool.coverage.report]
show_missing = true
precision = 1

# The type checker, and unlike coverage it IS a gate: the self-check job runs
# `python -m mypy` and fails on one error. Everything the project maintains
# in Python is listed - the shipped package, the shim, and the two files that
# run at install time and never ship - and the tests are not, which is a
# separate decision a later tranche can take. `strict` rather than a chosen
# subset, because a subset is a second list to keep in step with this one.
#
# `python_version` is pinned at 3.10, the lowest mypy 2 targets, and it is not
# the 3.9 floor CI runs the suite on. No checker can see that floor any more:
# typeshed dropped 3.9 with its EOL and removed the `>= (3, 10)` guards, so
# `int.bit_count` reads as always present whatever version is named here. The
# 3.9 leg of the test matrix is the check of the floor; this is the check of
# everything else, at the lowest version a checker still distinguishes.
[tool.mypy]
files = [
    "plugin/skills/extant/payload/extant",
    "plugin/skills/extant/payload/extant_collect.py",
    "plugin/skills/extant/install.py",
    "plugin/skills/extant/detect.py",
]
python_version = "3.10"
strict = true

# Two modules that exist only in some environments, and whose absence says
# nothing about this code. `tomli` is the pre-3.11 spelling of `tomllib`,
# installed by requirements-dev.txt on interpreters that need it and by
# nobody on the ones that do not; `tools.extant` is where the shim finds the
# package once it is installed into a target repository, and it is not here.
# Resolved in config rather than with a comment on the line, because whether
# either can be found is a fact about the interpreter running the check, and
# a per-line suppression that is needed on one machine and unused on the next
# would itself go red under `warn_unused_ignores`.
[[tool.mypy.overrides]]
module = ["tomli", "tools", "tools.*"]
ignore_missing_imports = true
