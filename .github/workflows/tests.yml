name: tests

# NOTE: a test fails while LICENSE still carries a placeholder copyright
# holder. That failure is deliberate: a green badge over an unpublishable
# license would be the exact kind of reassuring, false signal this project
# exists to prevent.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # Both platforms, because the git hooks are shell scripts and the tests run
    # them through a real `sh`. Line-ending and interpreter-resolution bugs in
    # those hooks only appear on one platform at a time, which is how one of
    # them survived undetected on POSIX for its entire existence.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show versions
        run: |
          python --version
          git --version

      # The TOOL has no third-party dependencies. The test suite is a separate
      # question and needs pytest, which is not in the standard library. This
      # step was originally missing, under a comment asserting that nothing
      # needed installing, and every matrix job failed identically.
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run the suite
        run: python -m pytest

  scenarios:
    # The end-to-end matrix: a fresh repository per scenario, the tool
    # installed into it, and assertions about what should happen.
    #
    # It ran by hand until now, which is precisely how a stale assertion
    # survived. When the trunk guard became opt-in, the hooks scenario went on
    # asserting that a default install wires a blocking pre-commit hook, and
    # nothing said so until someone remembered to run the harness before a
    # release. Here it fails on the commit that causes it.
    #
    # Linux also removes the local trap that hid it: `sh` is always present, so
    # the ten hook tests that SKIP on a machine without one all actually run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Against a `git archive` extract rather than the working tree, so what
      # is exercised is what would actually ship. A file that is present
      # locally but untracked would otherwise pass here and be missing for
      # everyone else.
      - name: Build a shippable extract
        run: |
          mkdir -p /tmp/pkg
          git archive HEAD | tar -x -C /tmp/pkg

      - name: Run the scenario matrix
        run: python tests/harnesses/scenarios.py /tmp/pkg /tmp/arena

  smoke:
    # The adversarial pass: 26 probes that try to break the tool rather than
    # confirm it works. Kept a SEPARATE job from the scenario matrix on
    # purpose - if it were a later step there, a scenario failure would mean
    # these never ran, and "did not run" would be indistinguishable from
    # "found nothing", which is the thing this project is about.
    #
    # It ran by hand until now, and a mutation campaign proved what that
    # costs: a deleted guard against overwriting hand-edited agent files left
    # the whole pytest suite green, and only this harness noticed. That gap is
    # recorded at tests/test_install_presets.py, where a regression test was
    # added afterwards.
    #
    # Roughly 70 seconds, measured on Windows, where process spawning is
    # dearer than it is here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build a shippable extract
        run: |
          mkdir -p /tmp/pkg
          git archive HEAD | tar -x -C /tmp/pkg

      # Exits 1 on a flag that is not in the harness's EXPECTED ledger, and
      # equally on an EXPECTED flag that stops appearing. The second case is
      # the one worth having: a probe that quietly stops exercising anything
      # otherwise prints exactly what a healthy one prints.
      - name: Try to break the tool
        run: python tests/harnesses/smoke.py /tmp/pkg /tmp/arena

  fuzz:
    # Hostile repositories built at random, checked against properties that
    # hold whatever the right answer is: no crash, no hang, a documented exit
    # code, findings never exceeding the denominator, two runs agreeing, and
    # SARIF parsing and matching the text count.
    #
    # HERE rather than only by hand, because a DEVELOPER MACHINE skips shapes.
    # Windows withholds the privilege symlinks need and some sandboxes refuse
    # the submodule transport, so a developer run reports those as "could not
    # build" - which the harness prints as its own count rather than as a pass.
    # This job is where that coverage is actually held.
    #
    # A FIXED seed, deliberately. A random seed per commit would fail `main`
    # for reasons unrelated to the commit that ran it, and a gate that cries
    # wolf gets switched off. Discovery is a hand-run with a fresh seed; what
    # belongs in CI is the part that is reproducible. Findings do not stay in
    # this harness either way - they are reduced to cases in
    # tests/test_fuzz_findings.py, which the suite runs on every commit.
    #
    # TWO LEGS SINCE STAGE 6, and the Windows one is not duplication - though
    # NOT for the reason first written here. That said each leg reports its own
    # "could not build" column; measured on the first two-leg run, GitHub's
    # Windows runners CAN create symlinks, so both legs build every shape and
    # the columns are IDENTICAL. The differing column is a developer-machine
    # phenomenon. What the leg is actually for is the shapes that only matter
    # on Windows - CRLF, a case-insensitive filesystem, MAX_PATH - which were
    # fuzzed nowhere before it.
    #
    # The identical results buy something unplanned and better. Both legs draw
    # ONE seed and report the same corpus and the same ledgers, which is direct
    # evidence that `core.autocrlf` is pinned. Left unset it is true at system
    # level on Windows and unset on Linux, so one seed would build DIFFERENT
    # corpora on the two legs and nothing would say so.
    #
    # `fail-fast: false` because the interesting result is which leg went red.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pkg: /tmp/fuzzpkg
            arena: /tmp/fuzzarena
            fail: /tmp/fuzzfail
          # SHORT, NATIVE, AND ON C:. Both halves are load-bearing and both
          # were learned the hard way. A generated repository carries
          # `tools/extant/rules/*.py` and a full object store, so past roughly
          # 260 characters git starts failing individual writes and the build
          # produces repositories with no commits - measured at 2 of 12
          # collapsing at a 183-character arena path. And an MSYS-style
          # `/tmp/...` path is one Python on Windows cannot open at all, which
          # makes the harness report an empty run that reads exactly like a
          # clean one.
          - os: windows-latest
            pkg: C:/fzpkg
            arena: C:/fzarena
            fail: C:/fzfail
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # git bash on the Windows leg, so one set of steps serves both. The
        # paths above are native either way; only the shell is shared.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build a shippable extract
        run: |
          mkdir -p "${{ matrix.pkg }}"
          git archive HEAD | tar -x -C "${{ matrix.pkg }}"

      # Exits 1 on a property violation and 2 when the generator reached no
      # rules at all, which is the harness reporting itself broken rather
      # than reporting the tool clean.
      - name: Build hostile repositories
        run: >
          python tests/harnesses/fuzz.py "${{ matrix.pkg }}" "${{ matrix.arena }}"
          --seed 20260824 --repos 35 --save "${{ matrix.fail }}"

      - name: Keep the recipe of anything that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Per leg, or the second upload collides with the first and the
          # surviving artifact describes whichever platform finished last.
          name: fuzz-failures-${{ matrix.os }}
          path: ${{ matrix.fail }}
          if-no-files-found: ignore

  self-check:
    # The tool validating its own status document. fetch-depth 0 because a
    # shallow clone cannot answer "is this commit an ancestor of trunk" at all
    # -- it would report dead references for commits that exist perfectly well.
    #
    # Runs on pull requests as well as pushes. It was restricted to pushes,
    # which contradicted the reason given below for --format=github: those
    # annotations appear on the offending line of a PR diff, and no PR was ever
    # annotated. A document broken by a PR was only caught after merging it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pull_request checkout is a detached merge ref, so `main` exists only
      # as a remote-tracking branch. Without a local one every ancestry check
      # fails to resolve and reports commits that are perfectly fine.
      - name: Make the trunk ref resolvable
        run: |
          git show-ref --verify --quiet refs/heads/main             || git branch main origin/main
          git rev-parse --verify main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # --format=github turns each finding into a workflow annotation, so a
      # false claim is highlighted on the offending line in the pull request
      # diff rather than buried in a log nobody expands. Needs no extra
      # permissions, unlike a SARIF upload.
      - name: Validate this repository's own status document
        run: >
          python plugin/skills/extant/payload/extant_collect.py
          --verify --repo . --format=github

      # Sub-second, because it runs no tests: it only asks whether every
      # mutation still matches the code it names. Mutations rot alongside that
      # code - one silently stopped probing anything when ancestry moved to a
      # batched rev-list, and it went unnoticed until the next half-hour
      # campaign. This catches that at the commit which causes it.
      - name: Are the mutations still pointed at real code?
        run: python tests/harnesses/mutate.py --check-only

      # The performance numbers in the docs were all measured on Windows, where
      # process spawning is expensive, and the docs say so rather than claiming
      # a Linux figure that was never taken. This takes it, so the claim has
      # evidence on the platform most people will run this on.
      - name: Measure validation cost on Linux
        run: |
          python - <<'PY'
          import subprocess, sys, time, pathlib
          tool = "plugin/skills/extant/payload/extant_collect.py"
          doc = pathlib.Path("NEXT_SESSION.md")
          samples = []
          for _ in range(5):
              start = time.perf_counter()
              subprocess.run([sys.executable, tool, "--verify", "--repo", "."],
                             capture_output=True)
              samples.append(time.perf_counter() - start)
          samples.sort()
          median = samples[len(samples) // 2]
          lines = len(doc.read_text(encoding="utf-8").splitlines())
          print(f"::notice::--verify on {lines} lines: {median * 1000:.0f} ms "
                f"median of 5 (Linux, {sys.version.split()[0]})")
          print(f"linux --verify median: {median * 1000:.0f} ms over {lines} lines")
          PY

      # --verify answers "is the document clean". This answers the harder
      # question: "would these rules notice if it were not". It corrupts one
      # real claim per rule and fails if any rule stays silent.
      - name: Probe every rule against that document
        run: python plugin/skills/extant/payload/extant_collect.py --selftest --repo .
