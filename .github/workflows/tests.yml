name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # Both platforms, because the git hooks are shell scripts and the tests run
    # them through a real `sh`. Line-ending and interpreter-resolution bugs in
    # those hooks only appear on one platform at a time, which is how one of
    # them survived undetected on POSIX for its entire existence.
    runs-on: ${{ matrix.os }}
    # EVERY job in this file has a timeout, sized by one rule: three times the
    # slowest time the job took in the last five runs (2026-09-27 and -28),
    # rounded up to a multiple of five minutes, never under five. Three,
    # because one job varies by nearly two between runs on GitHub's runners -
    # the Windows 3.13 leg took 5.4 minutes in one run and 9.3 in another -
    # and a healthy slow runner must not be cancelled. A timeout at all,
    # because none was set, so a hung job would have held the pull request's
    # verdict for GitHub's default of six hours. Here: 1.1 to 1.9 minutes on
    # Linux, and 3.0 to 5.1 on Windows since it went parallel - 9.8 serially
    # before that, which twenty still covers twice. The one Linux leg that
    # also runs the shuffled suite below takes about one run longer.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.14 since Phase 56, and the classifiers in pyproject.toml say the
        # same - tests/test_docs_match_code.py fails when the two lists differ.
        # On Linux 3.14 the sweep's pool starts with `forkserver`, a method no
        # earlier leg used; WSL's 3.14.4 ran the suite under it before this
        # leg existed.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      # PYTHON 3.9 ON WINDOWS FROM python.org's NUGET PACKAGE, not from its
      # installer. 3.9 is the one version the Windows image does not carry,
      # so setup-python fetched it every run: a median of 46 s over nine runs
      # to 2026-10-01, the slowest setup in the file, and 31 s of it the
      # python.org installer running silently - the download took half a
      # second. 3.9.13 is the last 3.9 python.org built for Windows, so what
      # this installs never changes.
      #
      # The NuGet package `python` is the same build without the installer:
      # published by the Python Software Foundation, its python.exe,
      # python39.dll, _ssl, _sqlite3, libcrypto and vcruntime byte-identical
      # to python.org's embeddable zip of 3.9.13, and the SHA-512 below is the
      # one NuGet publishes for it. This does what setup-python's install
      # script does - its directory in the tool cache, the `python3.exe`
      # link, ensurepip and the pip upgrade, and `x64.complete` last - except
      # run the installer, so setup-python finds 3.9.13 cached and installs
      # nothing. What the installer adds and this does not - tkinter,
      # CPython's own test suite, the `py` launcher, registry entries - the
      # suite does not use: it passed 1,529 tests with 8 skipped on this build
      # on the development machine, as it does on 3.14 there.
      #
      # The marker file is for the step after setup-python, which fails
      # unless it is still there - setup-python reinstalling would have
      # deleted the directory - so this cannot fall back to the installer
      # without saying so.
      - name: Python 3.9 on Windows, without its installer
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.9'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $version = "3.9.13"
          $published = "v138Fa+4B/wtiRX8515aIAUO6ntZK0Qw1TffSh7MeaBtkDgfudx4ELe9Hf3lXNlMaj6eNsHj5jcVI3gAZCNVwA=="
          $package = Join-Path $env:RUNNER_TEMP "python.$version.nupkg"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/python/$version/python.$version.nupkg" -OutFile $package
          $sha512 = [Security.Cryptography.SHA512]::Create()
          $actual = [Convert]::ToBase64String($sha512.ComputeHash([IO.File]::ReadAllBytes($package)))
          if ($actual -ne $published) {
            throw "python.$version.nupkg is not the package NuGet published: SHA-512 $actual"
          }
          $versionPath = Join-Path $env:RUNNER_TOOL_CACHE "Python\$version"
          $archPath = Join-Path $versionPath "x64"
          if (Test-Path $archPath) {
            throw "$archPath exists already: the image carries 3.9 now, and this step can go"
          }
          # Unpacked beside its destination: the tool cache is on C: and
          # RUNNER_TEMP on D:, and a directory cannot be moved across drives.
          $unpacked = Join-Path $versionPath "nuget"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($package, $unpacked)
          Move-Item -Path (Join-Path $unpacked "tools") -Destination $archPath
          Remove-Item -Path $unpacked -Recurse -Force
          New-Item -Path "$archPath\python3.exe" -ItemType SymbolicLink -Value "$archPath\python.exe" | Out-Null
          $env:PIP_ROOT_USER_ACTION = "ignore"
          & "$archPath\python.exe" -m ensurepip
          if ($LASTEXITCODE -ne 0) { throw "ensurepip failed" }
          & "$archPath\python.exe" -m pip install --upgrade --force-reinstall pip --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "the pip upgrade failed" }
          New-Item -ItemType File -Path (Join-Path $archPath "installed-from-nuget") | Out-Null
          New-Item -ItemType File -Path $versionPath -Name "x64.complete" | Out-Null

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # FAILS unless setup-python took the tree the step above installed: an
      # installer run would have replaced the directory and its marker. Then
      # says which interpreter `python` and `python3` are, since a hook that
      # calls `python3` must get the same 3.9.
      - name: Did setup-python take that tree?
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.9'
        run: |
          if (-not (Test-Path (Join-Path $env:pythonLocation "installed-from-nuget"))) {
            throw "setup-python did not use the NuGet tree at $env:pythonLocation"
          }
          python -c "import sys; print(sys.version); print(sys.executable)"
          python3 -c "import sys; print(sys.executable)"

      - name: Show versions
        run: |
          python --version
          git --version

      # NO AUTOMATIC GIT MAINTENANCE, in every job that builds repositories.
      # Every `git commit` starts a detached `git maintenance run --auto`:
      # 1,580 of them in one run of the suite on the development machine on
      # 2026-09-30, and a commit took 95 ms with it against 60 ms without. In
      # a test-sized repository it never acts - `gc.auto` waits for 6,700
      # loose objects, and 60 commits and 60 tags left the same shape either
      # way - and the detached child writes inside `.git` while a fixture is
      # being removed. tests/harnesses/mutate.py already sets the same key for
      # a campaign; design/quality.md has the measurement.
      #
      # GLOBAL CONFIG rather than GIT_CONFIG_COUNT, so the environment the
      # tool and tests/test_git_environment.py see is the runner's own. The
      # remote fast path does read this file, and declines only on a rewrite,
      # an include or a remote, none of which `[maintenance]` is. `--get`
      # fails the step if the setting did not take, and `--show-origin`
      # prints the file it landed in.
      - name: No automatic git maintenance
        run: |
          git config --global maintenance.auto false
          git config --global --show-origin --get maintenance.auto

      # The TOOL has no third-party dependencies. The test suite is a separate
      # question and needs pytest, which is not in the standard library. This
      # step was originally missing, under a comment asserting that nothing
      # needed installing, and every matrix job failed identically.
      #
      # requirements-test.txt, not requirements-dev.txt: the second adds mypy
      # and coverage, which no test imports. In run 36810678088 the install
      # took 7 s on the Windows 3.9 leg, where mypy's marker leaves it out,
      # against 15 to 27 s on the other Windows legs.
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      # TEMP ON THE WORK DRIVE, on Windows. TEMP is
      # `C:\Users\RUNNER~1\AppData\Local\Temp`, on the image's system drive,
      # while the workspace and RUNNER_TEMP are on D:, and every tmp_path the
      # suite builds a repository in lands under TEMP. pip's Windows CI got 10
      # to 28 per cent faster from this move alone (sichard.ca, March 2025).
      # RUNNER_TEMP rather than a written-out D:, because GitHub removed D:
      # from its Windows Server 2025 image once (actions/runner-images#12416)
      # and restored it: wherever the runner keeps its temp, this follows.
      - name: Temp on the work drive
        if: matrix.os == 'windows-latest'
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"

      # THE REAL GIT FIRST, on Windows, arranged the way its launcher would
      # arrange it. The image puts `Git\bin` first on PATH and its git.exe is
      # a launcher, so every git the suite started outside a hook paid a
      # second process: 59.7 against 33.3 ms a call on the development
      # machine, about 6,000 calls in a run of the suite. What the launcher
      # sets for the git it starts - its `mingw64\bin` and `usr\bin` first,
      # MSYSTEM, and PLINK_PROTOCOL when unset - is what `child_environment`
      # in tests/harnesses/mutate.py already arranges for a campaign, so this
      # asks it rather than keeping a second copy. It is also what Git Bash
      # gives a suite run on the development machine. The runner puts the
      # LAST line of GITHUB_PATH first (Handler.cs in actions/runner), hence
      # the reversal.
      #
      # Not the git an adopter's PowerShell resolves, which stays the
      # launcher, but the one the launcher would have started. The tool's
      # lookup of the system config from the first git on PATH reaches the
      # same `etc\gitconfig` from either, and tests/test_remote_from_disk.py
      # pins both layouts.
      - name: The real git first
        if: matrix.os == 'windows-latest'
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.path.join("tests", "harnesses"))
          import mutate
          before = os.environ["PATH"]
          after = mutate.child_environment(platform="win32")
          if after["PATH"] == before:
              print("the first git on PATH is not a launcher; nothing to move")
              sys.exit(0)
          assert after["PATH"].endswith(os.pathsep + before), after["PATH"]
          ahead = after["PATH"][: -len(before) - 1].split(os.pathsep)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as fh:
              for entry in reversed(ahead):
                  fh.write(entry + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              for key in ("MSYSTEM", "PLINK_PROTOCOL"):
                  if key in after and after[key] != os.environ.get(key):
                      fh.write(f"{key}={after[key]}\n")
          print("ahead of the launcher: " + ", ".join(ahead))

      # WHICH git THE SUITE STARTS, and what `-n auto` and every tmp_path are
      # built from, printed last before the suite so a leg's log shows what
      # the steps above arranged rather than what the image implies:
      # every git on PATH in order, with its size - the launcher was 43,352
      # bytes on the runner in run 36829093473, the real binary over 4 MB -
      # the cores, and the temp directory. `shell: python` so one script
      # serves both platforms AND sees the PATH the suite step sees: a
      # `shell: bash` step on Windows would see Git Bash's PATH instead. A git
      # started INSIDE a hook sees git's own exec path first, so this is not
      # the git a hook gets.
      - name: Show what the suite will start
        shell: python
        run: |
          import os, tempfile
          name = "git.exe" if os.name == "nt" else "git"
          for entry in os.environ["PATH"].split(os.pathsep):
              exe = os.path.join(entry, name)
              if entry and os.path.isfile(exe):
                  print(f"git on PATH: {exe} ({os.path.getsize(exe)} bytes)")
          print(f"cpu_count: {os.cpu_count()}")
          print(f"temp: {tempfile.gettempdir()}")
          print(f"RUNNER_TEMP: {os.environ.get('RUNNER_TEMP')}")
          print(f"MSYSTEM: {os.environ.get('MSYSTEM')}")

      # Serially on Linux, which stays the definition of correctness (AGENTS.md,
      # "It is an invocation, not a default"); in parallel on Windows, where a
      # process start costs several times what it costs on Linux and the suite
      # spawns thousands. Measured on 2026-09-28: the serial Windows legs took
      # 5.5 to 9.4 minutes against about 1.5 on Linux, 39 of the run's 61 job-
      # minutes, and every pull request waited on the slowest of them. The
      # autouse guard in tests/conftest.py fails any test that leaves the kind of
      # process state a different order would turn into another test's failure.
      #
      # --durations=15 prints each leg's fifteen slowest tests, for the
      # pytest-timeout bound the next tranche sets. That bound takes the
      # slowest test on ANY leg, likely a Windows one measured under -n auto,
      # where the workers contend for the runner's cores - an overstatement,
      # which is the safe side for a timeout.
      - name: Run the suite
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13'
        run: python -m pytest --durations=15 ${{ matrix.os == 'windows-latest' && '-n auto --dist loadfile' || '' }}

      # A THIRD ORDER, on one leg. Linux runs file order and Windows each
      # file's own order, and on 2026-09-28 a test leaking a rule's error into
      # the next was invisible to both; the autouse guard in tests/conftest.py
      # now catches that one kind. This is for the kinds nobody has found:
      # `--order-seed` shuffles the whole suite (tests/test_suite_order.py).
      # Before it was added the suite passed four shuffled orders, three
      # serially on Linux and one in parallel on Windows.
      #
      # On 3.13 rather than 3.14, so a red here cannot be the new Python's.
      # A FIXED seed, for the fuzz job's reason: re-running a commit runs the
      # same order, and a red run is reproduced locally by copying its
      # command. The order still moves, since adding one test reshuffles all
      # of them, so a dependency older than a commit can surface on it; the
      # pair of tests the failure names is real either way.
      #
      # SIDE BY SIDE with that leg's file-order run, since 2026-10-01, rather
      # than after it: back to back they took 97 and 91 s of a 204 s job in
      # run 36810678088, the longest of the Linux test legs. Both are still
      # serial runs, one process each, on a four-core runner. The shuffled
      # one gets a temp root of its own and no cache plugin, so the two never
      # write the same `pytest-N` directory or `.pytest_cache` file. The
      # file-order run prints as it goes and the shuffled run's output
      # follows it; either failing fails the step, and the last line says
      # which.
      - name: Run the suite, and again shuffled, side by side
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m pytest --order-seed=20260928 -p no:cacheprovider \
            --basetemp=/tmp/pytest-shuffled > /tmp/shuffled.log 2>&1 &
          shuffled=$!
          set +e
          python -m pytest --durations=15
          in_order=$?
          wait "$shuffled"
          reordered=$?
          set -e
          echo
          echo "=== the shuffled run: python -m pytest --order-seed=20260928 ==="
          cat /tmp/shuffled.log
          echo "file order exited $in_order; shuffled exited $reordered"
          test "$in_order" -eq 0 && test "$reordered" -eq 0

  scenarios:
    # The end-to-end matrix: a fresh repository per scenario, the tool
    # installed into it, and assertions about what should happen.
    #
    # It ran by hand until now, which is precisely how a stale assertion
    # survived. When the trunk guard became opt-in, the hooks scenario went on
    # asserting that a default install wires a blocking pre-commit hook, and
    # nothing said so until someone remembered to run the harness before a
    # release. Here it fails on the commit that causes it.
    #
    # Linux also removes the local trap that hid it: `sh` is always present, so
    # the ten hook tests that SKIP on a machine without one all actually run.
    runs-on: ubuntu-latest
    # 0.3 to 0.4 minutes; the tests job states the rule.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The tests job says why.
      - name: No automatic git maintenance
        run: |
          git config --global maintenance.auto false
          git config --global --show-origin --get maintenance.auto

      # Against a `git archive` extract rather than the working tree, so what
      # is exercised is what would actually ship. A file that is present
      # locally but untracked would otherwise pass here and be missing for
      # everyone else.
      - name: Build a shippable extract
        run: |
          mkdir -p /tmp/pkg
          git archive HEAD | tar -x -C /tmp/pkg

      - name: Run the scenario matrix
        run: python tests/harnesses/scenarios.py /tmp/pkg /tmp/arena

  smoke:
    # The adversarial pass: 26 probes that try to break the tool rather than
    # confirm it works. Kept a SEPARATE job from the scenario matrix on
    # purpose - if it were a later step there, a scenario failure would mean
    # these never ran, and "did not run" would be indistinguishable from
    # "found nothing", which is the thing this project is about.
    #
    # It ran by hand until now, and a mutation campaign proved what that
    # costs: a deleted guard against overwriting hand-edited agent files left
    # the whole pytest suite green, and only this harness noticed. That gap is
    # recorded at tests/test_install_presets.py, where a regression test was
    # added afterwards.
    #
    # Roughly 70 seconds, measured on Windows, where process spawning is
    # dearer than it is here.
    runs-on: ubuntu-latest
    # 0.9 to 1.0 minutes here; the tests job states the rule.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The tests job says why.
      - name: No automatic git maintenance
        run: |
          git config --global maintenance.auto false
          git config --global --show-origin --get maintenance.auto

      - name: Build a shippable extract
        run: |
          mkdir -p /tmp/pkg
          git archive HEAD | tar -x -C /tmp/pkg

      # Exits 1 on a flag that is not in the harness's EXPECTED ledger, and
      # equally on an EXPECTED flag that stops appearing. The second case is
      # the one worth having: a probe that quietly stops exercising anything
      # otherwise prints exactly what a healthy one prints.
      - name: Try to break the tool
        run: python tests/harnesses/smoke.py /tmp/pkg /tmp/arena

  fuzz:
    # Hostile repositories built at random, checked against properties that
    # hold whatever the right answer is: no crash, no hang, a documented exit
    # code, findings never exceeding the denominator, two runs agreeing, and
    # SARIF parsing and matching the text count.
    #
    # HERE rather than only by hand, because a DEVELOPER MACHINE skips shapes.
    # Windows withholds the privilege symlinks need and some sandboxes refuse
    # the submodule transport, so a developer run reports those as "could not
    # build" - which the harness prints as its own count rather than as a pass.
    # This job is where that coverage is actually held.
    #
    # A FIXED seed, deliberately. A random seed per commit would fail `main`
    # for reasons unrelated to the commit that ran it, and a gate that cries
    # wolf gets switched off. Discovery is a hand-run with a fresh seed; what
    # belongs in CI is the part that is reproducible. Findings do not stay in
    # this harness either way - they are reduced to cases in
    # tests/test_fuzz_findings.py, which the suite runs on every commit.
    #
    # TWO LEGS SINCE STAGE 6, and the Windows one is not duplication - though
    # NOT for the reason first written here. That said each leg reports its own
    # "could not build" column; measured on the first two-leg run, GitHub's
    # Windows runners CAN create symlinks, so both legs build every shape and
    # the columns are IDENTICAL. The differing column is a developer-machine
    # phenomenon. What the leg is actually for is the shapes that only matter
    # on Windows - CRLF, a case-insensitive filesystem, MAX_PATH - which were
    # fuzzed nowhere before it.
    #
    # The identical results buy something unplanned and better. Both legs draw
    # ONE seed and report the same corpus and the same ledgers, which is direct
    # evidence that `core.autocrlf` is pinned. Left unset it is true at system
    # level on Windows and unset on Linux, so one seed would build DIFFERENT
    # corpora on the two legs and nothing would say so.
    #
    # `fail-fast: false` because the interesting result is which leg went red.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 6.1 to 7.4 minutes on Windows - the slowest job in the file since the
    # Windows tests went parallel, and so the length of a run - and 1.4 to
    # 2.0 on Linux; the tests job states the rule.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 10 }}
    defaults:
      run:
        # git bash on the Windows leg, so one set of steps serves both. The
        # paths are native either way; only the shell is shared.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The tests job says why. Under Git Bash on Windows, as the harness
      # runs, so the setting lands in the HOME the harness's git reads.
      - name: No automatic git maintenance
        run: |
          git config --global maintenance.auto false
          git config --global --show-origin --get maintenance.auto

      # WHERE THE HARNESS BUILDS: SHORT, AND NATIVE. Both are load-bearing and
      # both were learned the hard way. A generated repository carries
      # `tools/extant/rules/*.py` and a full object store, so past roughly 260
      # characters git starts failing individual writes and the build produces
      # repositories with no commits - measured at 2 of 12 collapsing at a
      # 183-character arena path. And an MSYS-style `/tmp/...` path is one
      # Python on Windows cannot open at all, which makes the harness report an
      # empty run that reads exactly like a clean one.
      #
      # On Windows, under RUNNER_TEMP, written with forward slashes: on the D:
      # drive that holds the workspace rather than C:, the image's system drive,
      # where the arena was until 2026-10-01 - the tests job's temp step gives
      # the reason and the source. `D:/a/_temp/fzarena` is 18 characters. On
      # Linux, /tmp as before.
      - name: Where the harness builds
        shell: python
        run: |
          import os, pathlib
          root = (pathlib.Path(os.environ["RUNNER_TEMP"]).as_posix()
                  if os.name == "nt" else "/tmp")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              for key, leaf in (("FUZZ_PKG", "fzpkg"), ("FUZZ_ARENA", "fzarena"),
                                ("FUZZ_FAIL", "fzfail")):
                  fh.write(f"{key}={root}/{leaf}\n")
                  print(f"{key}={root}/{leaf}")

      - name: Build a shippable extract
        run: |
          mkdir -p "$FUZZ_PKG"
          git archive HEAD | tar -x -C "$FUZZ_PKG"

      # The git, and the cores, the harness inherits: under Git Bash, as the
      # step below runs, rather than the runner's own PATH the tests job's
      # step of this kind reads.
      - name: Show which git the harness will start
        run: |
          type -a git
          nproc

      # Exits 1 on a property violation and 2 when the generator reached no
      # rules at all, which is the harness reporting itself broken rather
      # than reporting the tool clean.
      #
      # `-u`, so each repository's line reaches the log when that repository
      # finishes, and the log's timestamps give each one's cost. Buffered, all
      # 35 lines arrived together at the end of the step, and a step cancelled
      # at its timeout would have shown none of them. What is printed is
      # unchanged.
      - name: Build hostile repositories
        run: >
          python -u tests/harnesses/fuzz.py "$FUZZ_PKG" "$FUZZ_ARENA"
          --seed 20260824 --repos 35 --save "$FUZZ_FAIL"

      - name: Keep the recipe of anything that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Per leg, or the second upload collides with the first and the
          # surviving artifact describes whichever platform finished last.
          name: fuzz-failures-${{ matrix.os }}
          path: ${{ env.FUZZ_FAIL }}
          if-no-files-found: ignore

  self-check:
    # The tool validating its own status document. fetch-depth 0 because a
    # shallow clone cannot answer "is this commit an ancestor of trunk" at all
    # -- it would report dead references for commits that exist perfectly well.
    #
    # Runs on pull requests as well as pushes. It was restricted to pushes,
    # which contradicted the reason given below for --format=github: those
    # annotations appear on the offending line of a PR diff, and no PR was ever
    # annotated. A document broken by a PR was only caught after merging it.
    runs-on: ubuntu-latest
    # 3.6 to 4.3 minutes, most of it `fuzz.py --self-check`, and three of
    # those its HANG breakage waiting out the corpus's 90-second TIMEOUT
    # twice. That was before 2026-10-01, when the red half began running
    # under a budget derived from its clean half (`red_budget` in
    # tests/harnesses/fuzz_selfcheck.py); the timeout below was sized before
    # that change. The tests job states the rule.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pull_request checkout is a detached merge ref, so `main` exists only
      # as a remote-tracking branch. Without a local one every ancestry check
      # fails to resolve and reports commits that are perfectly fine.
      - name: Make the trunk ref resolvable
        run: |
          git show-ref --verify --quiet refs/heads/main             || git branch main origin/main
          git rev-parse --verify main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The tests job says why: `--self-check` below builds a repository.
      - name: No automatic git maintenance
        run: |
          git config --global maintenance.auto false
          git config --global --show-origin --get maintenance.auto

      # --format=github turns each finding into a workflow annotation, so a
      # false claim is highlighted on the offending line in the pull request
      # diff rather than buried in a log nobody expands. Needs no extra
      # permissions, unlike a SARIF upload.
      - name: Validate this repository's own status document
        run: >
          python plugin/skills/extant/payload/extant_collect.py
          --verify --repo . --format=github

      # Sub-second, because it runs no tests: it only asks whether every
      # mutation still matches the code it names. Mutations rot alongside that
      # code - one silently stopped probing anything when ancestry moved to a
      # batched rev-list, and it went unnoticed until the next half-hour
      # campaign. This catches that at the commit which causes it.
      - name: Are the mutations still pointed at real code?
        run: python tests/harnesses/mutate.py --check-only

      # A step of this job rather than a test, because the suite runs on 3.9
      # and mypy 2 does not; a test that skipped there would print as a pass
      # on the one leg whose floor it cannot see anyway. The version is
      # printed first so a verdict that moved between releases can be told
      # from one that moved with the code. About three seconds on the
      # development machine; every error names its file and line.
      # `[tool.mypy]` in pyproject.toml is the whole configuration: the
      # files, the 3.10 target, `strict`.
      - name: Do the types still agree with the code?
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m mypy --version
          python -m mypy

      # The performance numbers in the docs were all measured on Windows, where
      # process spawning is expensive, and the docs say so rather than claiming
      # a Linux figure that was never taken. This takes it, so the claim has
      # evidence on the platform most people will run this on.
      - name: Measure validation cost on Linux
        run: |
          python - <<'PY'
          import subprocess, sys, time, pathlib
          tool = "plugin/skills/extant/payload/extant_collect.py"
          doc = pathlib.Path("NEXT_SESSION.md")
          samples = []
          for _ in range(5):
              start = time.perf_counter()
              subprocess.run([sys.executable, tool, "--verify", "--repo", "."],
                             capture_output=True)
              samples.append(time.perf_counter() - start)
          samples.sort()
          median = samples[len(samples) // 2]
          lines = len(doc.read_text(encoding="utf-8").splitlines())
          print(f"::notice::--verify on {lines} lines: {median * 1000:.0f} ms "
                f"median of 5 (Linux, {sys.version.split()[0]})")
          print(f"linux --verify median: {median * 1000:.0f} ms over {lines} lines")
          PY

      # --verify answers "is the document clean". This answers the harder
      # question: "would these rules notice if it were not". It corrupts one
      # real claim per rule and fails if any rule stays silent.
      - name: Probe every rule against that document
        run: python plugin/skills/extant/payload/extant_collect.py --selftest --repo .

      # The same question as the step above, one level up: --selftest asks
      # whether the RULES would notice, and this asks whether the FUZZER
      # would. It breaks the payload once per property and fails unless each
      # property goes red.
      #
      # IN THIS JOB rather than in `fuzz`, because it shares the question
      # `mutate.py --check-only` above asks. That step exists because a
      # mutation rots alongside the code it names; a breakage rots the same
      # way, and there is no --check-only for these - an anchor that MATCHES
      # is not a breakage that BITES, and only running it says which.
      #
      # AND BECAUSE NOTHING RAN IT. `AXIS` was aimed at a fallback in
      # `resolve_ref` that stopped being reached when `_from_table` began
      # answering from the ref table. The anchor still matched, so the harness
      # reported the property as watched while it could not fire, and all five
      # jobs stayed green over it. No job could have caught that, because this
      # mode ran nowhere in CI.
      #
      # LAST, because it is the slowest step here, and every cheaper
      # diagnostic above should report before it starts. Exits 1
      # while any property is unconfirmed and 2 on a harness fault - a stale
      # anchor or a repository that would not build - which is the harness
      # reporting itself broken rather than the tool clean.
      #
      # An extract and an arena for the reason the `fuzz` job needs them: it
      # edits the installed `tools/` of a repository it generates, and reads
      # `git archive` rather than the working tree so no untracked local file
      # can make it pass. No --seed, deliberately: this mode builds ONE
      # repository from a seed fixed in the harness, so a seed here would
      # be accepted and ignored.
      - name: Can every fuzz property still be provoked?
        run: |
          mkdir -p /tmp/scpkg
          git archive HEAD | tar -x -C /tmp/scpkg
          python tests/harnesses/fuzz.py /tmp/scpkg /tmp/scarena --self-check

  free-threaded:
    # The free-threaded build of 3.14, for ONE run and then a verdict.
    #
    # It is the instrument a thread-pooled sweep waits on (design/quality.md's
    # paragraph on 3.4 and `contextvars`): threads only pay without a GIL, and
    # neither the development machine nor its WSL has such an interpreter.
    # `setup-python` takes the `t` suffix (its docs/advanced-usage.md), and on
    # 2026-09-28 the manifest it installs from held 3.14.7 x64-freethreaded
    # for ubuntu 22.04, 24.04 and 26.04.
    #
    # REQUIRED since its first run, which was allowed to fail and did not:
    # CPython 3.14.7t, Py_GIL_DISABLED=1, the GIL off, and the suite 1,422
    # passed and 1 skipped in 69 seconds (pull request #21). It ran once with
    # continue-on-error and that line went - a leg allowed to stay red is the
    # note this file once opened with, saying one test failed on purpose.
    runs-on: ubuntu-latest
    # 1.5 minutes on its first run; sized as the serial Linux legs it
    # mirrors, 1.1 to 1.9. The tests job states the rule.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      # FAILS unless the build is free-threaded AND the GIL is off. A setup
      # that quietly handed over the ordinary build would make this a second
      # copy of the 3.14 leg, reporting itself as the free-threaded one.
      - name: Is this the free-threaded build, with the GIL off?
        run: |
          python - <<'PY'
          import sys, sysconfig
          built = sysconfig.get_config_var("Py_GIL_DISABLED")
          enabled = sys._is_gil_enabled()
          print(sys.version)
          print(f"Py_GIL_DISABLED={built} GIL enabled={enabled}")
          if built != 1 or enabled:
              print("::error::not a free-threaded interpreter with the GIL off")
              sys.exit(1)
          PY

      # The tests job says why.
      - name: No automatic git maintenance
        run: |
          git config --global maintenance.auto false
          git config --global --show-origin --get maintenance.auto

      # The tests job says why this file.
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      # Serially, as on the other Linux legs. An import in the test process
      # that turns the GIL back on raises a RuntimeWarning, and
      # `filterwarnings = error` in pytest.ini makes that warning a failure.
      - name: Run the suite
        run: python -m pytest --durations=15

  dogfood:
    # The action, run on this repository's own pull requests: the first run
    # of `action.yml` in this repository's CI. For the documents it is
    # redundant with the self-check job's --verify; what it tests is the
    # ACTION - its install, its input checks, the command it assembles.
    #
    # Its first run found the action unloadable. 0.28.0's `since` input
    # quoted the pull-request base in expression braces in its description;
    # the runner evaluates those there too, finds no `github`, and refused
    # the whole action before a step ran - every mode, every caller of
    # `@v0.28.0`. Nothing else here loads a manifest the way the runner
    # does, which is the whole case for this job.
    #
    # Written the way the README tells an adopter to write it, and no better:
    # `fetch-depth: 0`, the trunk-ref step, and `uses:`. NO setup-python,
    # because the README's snippet has none and `action.yml` relies on every
    # GitHub-hosted runner shipping a python. A job that set one up would
    # test a workflow no adopter was told to write.
    #
    # `uses: ./` installs from `github.action_path`, which here is the
    # checkout itself, so the pull request's own action.yml and package are
    # what run. One difference from an adopter's run follows from that: pip
    # builds in the source tree, leaving `build/` and
    # `plugin/skills/extant/payload/extant.egg-info/` in the tree being
    # checked (measured 2026-09-28). Git ignores both, and a directory that
    # exists can only make a path pointer resolve, never break one.
    #
    # On a pull request, the gate the README offers: only the claims the
    # change WROTE, measured from the base the event names. On a push to
    # main, `verify`, the action's default. Measured before this job existed:
    # `--introduced-since` over PR #19's content, 5 documents and 384
    # introduced lines, reported 0 findings on them.
    runs-on: ubuntu-latest
    # 0.1 minutes on its first green run, the action's install 3.4 seconds of
    # it; the tests job states the rule.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The README's line, for the self-check job's reason: on a pull request
      # `main` is only a remote-tracking branch.
      - name: Make the trunk ref resolvable
        run: |
          git show-ref --verify --quiet refs/heads/main             || git branch main origin/main
          git rev-parse --verify main

      - name: Check the claims this pull request wrote
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          mode: introduced-since
          since: ${{ github.event.pull_request.base.sha }}

      - name: Check the documents .extant.toml names
        if: github.event_name == 'push'
        uses: ./

  pre-commit:
    # The other adoption surface, `.pre-commit-hooks.yaml`, which nothing had
    # ever run. `try-repo` installs the hooks from this checkout's HEAD into
    # an environment of pre-commit's own - the path an adopter's `rev:` pin
    # takes - and runs each id here. `extant` is --verify, `extant-annotate`
    # the same with --format=github. Measured on the development machine
    # before this job existed, pre-commit 4.6.2: both passed, 27 and 26
    # seconds, about 25 of each building the environment.
    #
    # The trunk-ref step for the self-check job's reason: the hook is
    # --verify, and on a pull request `main` is only a remote-tracking branch.
    #
    # Bounded above for mypy's reason in requirements-dev.txt - a major can
    # change what the tool does, and a job that reddens on a release nobody
    # committed is a gate that cries wolf - and pinned here rather than in
    # that file, because only this job needs it.
    runs-on: ubuntu-latest
    # 0.3 minutes on its first run, both hooks passing; the tests job states
    # the rule.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Make the trunk ref resolvable
        run: |
          git show-ref --verify --quiet refs/heads/main             || git branch main origin/main
          git rev-parse --verify main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check "pre-commit>=4.6,<5"

      - name: Run the extant hook
        run: pre-commit try-repo . extant --all-files --verbose

      - name: Run the extant-annotate hook
        run: pre-commit try-repo . extant-annotate --all-files --verbose
