# The GitHub Action. Packaging over `--format=github`, which already exists.
#
#     - uses: actions/checkout@v4
#       with:
#         fetch-depth: 0          # REQUIRED - see below
#     - uses: scooter-sensei/extant@v0.24.1
#
# Or, on a pull request, gate only on the claims the change WROTE - no
# document to configure, no path pinned, and a finding on a line the range
# did not touch is reported and does not fail the job:
#
#     - uses: scooter-sensei/extant@v0.24.1
#       with:
#         mode: introduced-since
#         since: ${{ github.event.pull_request.base.sha }}
#
# WHY fetch-depth: 0 IS NOT OPTIONAL
#
# `actions/checkout` defaults to a depth-limited checkout, and this tool asks
# whether commits still exist. In a depth-limited repository nearly none of
# them do: measured on a held-out corpus, one project supplied 2,094 dead-SHA
# findings when checked out that way and 3 when checked out with its history.
# Every one of those 2,091 was the checkout, not the document.
#
# The run says so rather than reporting them - `is_shallow` is checked before
# any count is printed - but a wall of findings that names its own cause is
# still a wall of findings, so the fix belongs in the workflow.
#
# WHY THE VERSION APPEARS NOWHERE HERE
#
# The install is `pip install "$GITHUB_ACTION_PATH"` - the very source the
# caller pinned with `@v0.24.1`. Naming a version here would make this an
# eighth file carrying one, and the seven that do are cross-checked by
# `.extant.toml`'s consistency block precisely because they drifted once. An
# eighth that nothing checks is how that happens again.
name: extant
description: >
  Check that the claims in your documentation are still true - dead commit
  references, false merge claims, dead links and paths, releases that never
  shipped - against git and the filesystem.
author: scooter-sensei

branding:
  icon: check-square
  color: purple

inputs:
  mode:
    description: >
      `verify` checks the documents .extant.toml names and fails the job on a
      finding. `sweep` surveys every tracked markdown file and always passes -
      use it to see the shape of the problem before configuring anything.
      `introduced-since` reads the documents the checkout changed since its
      merge base with `since` and fails only on findings sitting on lines the
      range wrote; it needs no configuration at all.
    required: false
    default: verify
  since:
    description: >
      The ref `introduced-since` measures from - on a pull request,
      `${{ github.event.pull_request.base.sha }}`. Required by that mode and
      ignored by the others. The merge base must be present in the checkout,
      which is one more reason `fetch-depth: 0` is not optional.
    required: false
    default: ""
  repo:
    description: Repository root to check, relative to the workspace.
    required: false
    default: "."
  format:
    description: >
      `github` puts each finding on the offending line of the pull request.
      `text` and `sarif` are the other two; SARIF is for uploading to code
      scanning and puts nothing but JSON on stdout.
    required: false
    default: github
  args:
    description: >
      Extra flags, passed through verbatim - `--baseline`, `--suggest-fixes`,
      `--sha-map .git/filter-repo/commit-map`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # No third-party dependencies, so this is the tool and nothing else. Every
    # GitHub-hosted runner ships a python.
    - name: Install extant
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"

    # Every input arrives through the ENVIRONMENT, never interpolated into the
    # script. `${{ inputs.args }}` written inline is the documented Actions
    # injection hole: an input can carry a newline and everything after it is
    # then a command running with the workflow's token. The values are also
    # checked rather than trusted, so a typo in `mode` fails the step instead
    # of being pasted onto a command line.
    - name: Check the documentation
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_SINCE: ${{ inputs.since }}
      run: |
        set -eu
        case "$INPUT_MODE" in
          verify|sweep|introduced-since) : ;;
          *) echo "::error::mode must be 'verify', 'sweep' or 'introduced-since', not '$INPUT_MODE'" >&2
             exit 2 ;;
        esac
        # The range mode takes its base as the flag's VALUE, so the mode and
        # the ref are assembled here rather than as `--$INPUT_MODE` below. An
        # empty ref would reach the CLI as `--introduced-since ''` and be
        # refused there with a sentence about merge bases; the missing input
        # is the actual problem, so it is named here.
        MODE_FLAGS="--$INPUT_MODE"
        if [ "$INPUT_MODE" = introduced-since ]; then
          if [ -z "$INPUT_SINCE" ]; then
            echo "::error::mode 'introduced-since' needs the 'since' input: the ref the range is measured from, such as the pull request's base sha" >&2
            exit 2
          fi
          MODE_FLAGS="--introduced-since $INPUT_SINCE"
        fi
        case "$INPUT_FORMAT" in
          text|github|sarif) : ;;
          *) echo "::error::format must be 'text', 'github' or 'sarif', not '$INPUT_FORMAT'" >&2
             exit 2 ;;
        esac
        # Word-split deliberately and only here: `args` is a flag list, and
        # `MODE_FLAGS` is the mode with, for the range mode, its ref.
        # shellcheck disable=SC2086
        extant $MODE_FLAGS --repo "$INPUT_REPO" "--format=$INPUT_FORMAT" $INPUT_ARGS
