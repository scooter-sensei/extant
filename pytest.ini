[pytest]
# The suite, and only the suite: tests/harnesses/ holds the scripts the CI
# jobs run, and none of them is named test_*.py.
testpaths = tests
# requirements-dev.txt asks for pytest 8; an older one stops here instead of
# running on behaviour nobody tested.
minversion = 8.0
# -q --tb=short is the house output. -ra names every test that did NOT run:
# a skip examined nothing, and on 2026-09-28 seven skipped on Windows here,
# three on the Windows CI legs and one on Linux, none of them saying why.
# --strict-markers and --strict-config turn a mistyped mark or ini key into an
# error rather than a warning nobody reads. Deliberately NOT -n auto:
# AGENTS.md says why. And one -q is enough - a second on the command line
# makes -qq, which drops the final pass count.
addopts = -q --tb=short -ra --strict-markers --strict-config
# pytest SKIPS a parametrize over an empty list, which prints as nothing to
# see - "examined 0" dressed as a clean run, the failure this project exists
# to name. Three lists here are derived rather than written out (the
# installer's document presets, the consistency cases, the shells on PATH),
# so an empty one fails collection instead.
empty_parameter_set_mark = fail_at_collect
# Zero warnings on all ten CI legs and on this machine with every warning
# shown, measured 2026-09-28; the next one fails the run where it appears.
filterwarnings =
    error
# An xfail that starts passing is a claim gone stale. None exist today.
xfail_strict = true
# A test running past this many seconds has every thread's traceback dumped,
# so a hang NAMES the test that hung. It ends nothing: CI's timeout-minutes
# end a job, and tests/harnesses/mutate.py bounds each mutant's suite. 60 is
# three times the slowest test on any CI leg - 17.01 s, the Windows 3.10 leg
# under -n auto, the worst of tranche 18's three runs - rounded up, and
# tests/test_mutate_harness.py holds it there. Built in, so no plugin, and
# nothing --strict-config refuses where one is not installed (Phase 57).
faulthandler_timeout = 60
