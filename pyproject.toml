# Packaging exists for ONE reason: the pre-commit framework builds an isolated
# environment from a repository, and `language: python` needs something
# installable to build. Without this file, adopting the tool through pre-commit
# is impossible.
#
# This does not change how the tool is normally installed. The hooks and the
# slash command have to live inside the target repository, so `install.py`
# copying files in remains the primary path. Packaging covers the validation
# half only, which is the half pre-commit runs.
#
# One conditional dependency, deliberately. On Python 3.11 and newer this is
# the standard library and git, nothing else; below that `tomllib` does not
# exist yet, so `tomli` - the same parser under its original name - is pulled
# in to read a config file. A project with no config file needs neither.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "extant"
version = "0.16.2"
description = "Find the commits, branches and paths your documentation cites that no longer exist"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
# Conditional, and only for the PACKAGED path: pre-commit builds an isolated
# environment from this file, so a consumer on 3.9 or 3.10 gets the parser
# without being told to install anything. On 3.11+ this resolves to nothing
# and the tool has no dependencies at all. The copy-the-files-in path never
# reads this and degrades on its own.
dependencies = ['tomli>=2; python_version < "3.11"']
authors = [{name = "scooter-sensei"}]
keywords = ["documentation", "validation", "git", "pre-commit", "ai-agents",
            "agents", "llm", "adr", "documentation-rot", "stale-docs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/scooter-sensei/extant"
Changelog = "https://github.com/scooter-sensei/extant/blob/main/CHANGELOG.md"

[project.scripts]
extant = "extant_collect:cli"

[tool.setuptools]
package-dir = {"" = "plugin/skills/extant/payload"}
py-modules = ["extant_collect", "extant_config"]
